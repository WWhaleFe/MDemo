[workspace]
resolver = "2"
members = ["crates/mdemo-core", "crates/mdemo-golden", "crates/mdemo-ffi", "uniffi-bindgen"]

[workspace.package]
edition = "2021"
version = "0.16.0"
license = "MIT"

[workspace.dependencies]
uniffi = { version = "=0.28.3" }

# 앱 크기를 줄이는 설정 (계획표 1장)
[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"
strip = true
